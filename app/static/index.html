<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ttsim-blackhole</title>
<style>
  /* Palette lifted from tenstorrent/tt-awesome's site theme, for visual
     consistency with the rest of the Tenstorrent dev-tool ecosystem. */
  :root {
    color-scheme: dark;
    --bg0: #0F2A35; --bg1: #1A3C47; --bg2: #2D3142; --bg3: #0a1e28;
    --teal: #4FD1C5; --teal-lt: #81E6D9;
    --pink: #EC96B8; --green: #27AE60; --muted: #607D8B; --gold: #F4C471;
    --text: #E8F0F2; --text2: #B0C4DE;
    --red: #FF9E8A;
  }
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(79,209,197,0.2) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(79,209,197,0.2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(79,209,197,0.45); }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg0); color: var(--text); font-size: 14px;
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
  }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 0 20px;
            height: 44px; flex: 0 0 auto; background: var(--bg3);
            border-bottom: 1px solid rgba(79,209,197,0.15); }
  .logo { font-weight: 800; font-size: 15px; color: var(--teal);
          white-space: nowrap; letter-spacing: -0.3px; display: flex; align-items: center; gap: 6px; }
  .badge { font-size: 9px; padding: 2px 8px; border-radius: 8px; color: #fff;
           white-space: nowrap; letter-spacing: 0.3px; font-weight: 700; }
  .badge--sim { background: var(--muted); }
  .topbar-links { margin-left: auto; display: flex; gap: 14px; }
  .topbar-link { font-size: 11px; color: var(--text2); text-decoration: none; }
  .topbar-link:hover { color: var(--teal); }
  .topbar-link::after { content: " \2197"; font-size: 9px; opacity: 0.5; }

  /* Hero is a single compact strip -- the workspace below is the point,
     not a page you scroll past to reach it. */
  .hero { flex: 0 0 auto; padding: 10px 20px 6px; display: flex; align-items: baseline;
          gap: 10px; flex-wrap: wrap; }
  .eyebrow { display: none; }
  .title { font-size: 15px; font-weight: 800; color: var(--text);
           margin: 0; letter-spacing: -0.2px; white-space: nowrap; }
  .title::before { content: "\26A1"; margin-right: 6px; }
  .sub { font-size: 12px; color: var(--text2); line-height: 1.4; margin: 0;
         max-width: 760px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .wrap { flex: 1 1 auto; min-height: 0; padding: 0 20px 12px; display: flex;
          flex-direction: column; }
  .tt-cloud-playground-mount { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }

  @media (max-width: 900px) {
    html, body { height: auto; }
    body { overflow: auto; }
    .sub { white-space: normal; }
  }

  select {
    background: var(--bg1); color: var(--text); border: 1px solid var(--bg2);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; outline: none;
  }
  select:focus { border-color: var(--teal); }
  button {
    background: var(--teal); color: var(--bg3); border: none; font-weight: 700;
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: filter 0.1s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.6; cursor: default; }

  /* ── Cloud connection notice ─────────────────────────────────────────── */
  .tt-pg-cloud-notice { font-size: 11.5px; flex: 0 0 auto; margin-bottom: 8px; }
  .tt-pg-notice-ok { color: var(--green); }
  .tt-pg-notice-warn { color: var(--gold); }

  /* ── Category tab bar ─────────────────────────────────────────────────── */
  .tt-pg-tabbar { display: flex; gap: 6px; flex-wrap: wrap; flex: 0 0 auto; margin-bottom: 10px; }
  .tt-pg-tab {
    background: var(--bg1); color: var(--text2); border: 1px solid var(--bg2);
    font-size: 11px; font-weight: 700; letter-spacing: 0.3px; padding: 6px 12px;
    border-radius: 999px; cursor: pointer; white-space: nowrap; transition: all 0.12s;
  }
  .tt-pg-tab:hover { border-color: var(--teal); color: var(--text); filter: none; }
  .tt-pg-tab.active { background: rgba(79,209,197,0.14); border-color: var(--teal); color: var(--teal-lt); }

  /* ── Workspace: browse (discover) + do (edit/run), side by side ─────── */
  .tt-pg-workspace { flex: 1 1 auto; min-height: 0; display: flex; gap: 16px; }
  .tt-pg-browse-col { flex: 1 1 38%; min-width: 280px; min-height: 0; display: flex; flex-direction: column; }
  .tt-pg-browse-header { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; margin-bottom: 8px; }
  .tt-pg-category-desc { font-size: 11.5px; color: var(--muted); flex: 1; }
  .tt-pg-surprise-btn { background: var(--bg1); color: var(--teal-lt); border: 1px solid var(--bg2); white-space: nowrap; }
  .tt-pg-surprise-btn:hover { border-color: var(--teal); filter: none; }

  /* ── Card grid (its own scroll region -- browsing never pushes the
     editor/output off-screen) ─────────────────────────────────────────── */
  .tt-pg-card-grid {
    flex: 1; min-height: 0; overflow-y: auto; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    align-content: start; gap: 10px; padding: 2px 4px 2px 0;
  }
  .tt-pg-card {
    background: var(--bg1); border: 1px solid var(--bg2); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  .tt-pg-card:hover, .tt-pg-card:focus-visible {
    border-color: var(--teal); box-shadow: 0 0 0 1px rgba(79,209,197,0.25), 0 4px 16px rgba(0,0,0,0.25);
    transform: translateY(-1px); outline: none;
  }
  .tt-pg-card.active { border-color: var(--teal); background: rgba(79,209,197,0.07); }
  .tt-pg-card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
  .tt-pg-card-blurb { font-size: 11.5px; color: var(--text2); line-height: 1.5; flex: 1; }
  .tt-pg-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
  .tt-pg-card-complexity { display: flex; gap: 3px; }
  .tt-pg-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--bg2); }
  .tt-pg-dot.filled { background: var(--teal); }
  .tt-pg-card-tag { font-size: 9.5px; letter-spacing: 0.3px; color: var(--teal-lt);
                    background: rgba(79,209,197,0.1); padding: 2px 8px; border-radius: 8px; white-space: nowrap; }

  /* ── Toolbar ──────────────────────────────────────────────────────────── */
  .tt-pg-do-col { flex: 1 1 62%; min-width: 360px; min-height: 0; display: flex; flex-direction: column; }
  .tt-pg-toolbar { display: flex; gap: 12px; align-items: center; margin: 0 0 8px; flex: 0 0 auto; flex-wrap: wrap; }
  .tt-pg-active-label { font-size: 13px; font-weight: 700; color: var(--text); margin-right: auto; }
  .tt-pg-model-picker:not([hidden]) { display: flex; align-items: center; gap: 6px; }
  .tt-pg-label { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }

  /* ── Editor / output layout ──────────────────────────────────────────── */
  .tt-pg-layout { flex: 1; min-height: 0; display: flex; gap: 16px; flex-wrap: wrap; }
  .tt-pg-editor-col, .tt-pg-output-col {
    flex: 1; min-width: 300px; min-height: 200px; background: var(--bg1); border: 1px solid var(--bg2);
    border-radius: 10px; overflow: hidden; transition: border-color 0.18s;
    display: flex; flex-direction: column;
  }
  .tt-pg-editor-col:focus-within { border-color: var(--teal); }
  .tt-pg-output-header { font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase;
                         color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--bg2); flex: 0 0 auto; }
  .tt-pg-code, .tt-pg-output {
    flex: 1; min-height: 0; width: 100%; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 12.5px; background: var(--bg3); color: var(--text); border: none;
    padding: 14px; margin: 0; box-sizing: border-box; resize: none;
  }
  .tt-pg-code:focus { outline: none; }
  .tt-pg-output { overflow: auto; white-space: pre-wrap; color: var(--teal-lt); }
  .tt-pg-stderr { color: var(--red); }
  .tt-pg-ok { color: var(--green); }

  @media (max-width: 900px) {
    .tt-pg-workspace { flex-direction: column; height: auto; }
    .tt-pg-browse-col, .tt-pg-do-col { min-width: 0; }
    .tt-pg-card-grid { max-height: 320px; }
    .tt-pg-layout { flex-direction: column; }
    .tt-pg-editor-col, .tt-pg-output-col { height: 340px; flex: none; }
  }

  .footer { padding: 10px 20px; flex: 0 0 auto; display: flex; gap: 20px; flex-wrap: wrap; }
  .footer a { font-size: 11px; color: var(--text2); text-decoration: none; }
  .footer a:hover { color: var(--teal); }
  .footer a::after { content: " \2197"; font-size: 9px; opacity: 0.5; }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">&#x26A1; ttsim-blackhole <span class="badge badge--sim">simulator</span></div>
  <div class="topbar-links">
    <a class="topbar-link" href="https://github.com/tenstorrent/ttsim" target="_blank" rel="noopener">ttsim</a>
    <a class="topbar-link" href="https://github.com/tenstorrent/tt-vscode-toolkit" target="_blank" rel="noopener">tt-vscode-toolkit</a>
  </div>
</div>

<div class="hero">
  <h1 class="title">Real ttnn on a simulated Blackhole</h1>
  <p class="sub">
    Zero Tenstorrent hardware in this container. Pick a card, edit anything, hit Run &mdash; real output streams back from a real (virtual) chip.
  </p>
</div>

<div class="wrap">
  <div class="tt-cloud-playground-mount"></div>
</div>

<div class="footer">
  <a href="https://github.com/tenstorrent/ttsim">ttsim source</a>
  <a href="https://github.com/tenstorrent/tt-vscode-toolkit">tt-vscode-toolkit</a>
  <a href="https://github.com/tenstorrent/tt-awesome">tt-awesome</a>
</div>

<script>window.TTSIM_API_URL = "/execute";</script>
<script src="cloud-playground.js"></script>
</body>
</html>
